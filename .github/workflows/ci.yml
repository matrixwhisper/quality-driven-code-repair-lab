name: Python quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install 'pytest>=8,<9' 'psutil>=6,<8'
      - name: Run CPU regression tests
        run: python -m pytest -q
      - name: Check dataset and references
        run: python main.py quality --run-dir runs/ci
